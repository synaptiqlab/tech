<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Unbounded font loaded from Google Fonts directly in SVG -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;display=swap');
    .favicon-q {
      font-family: 'Unbounded', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 88px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Deep Black Background -->
  <rect width="128" height="128" rx="28" fill="#000000" />

  <!-- Clean Bold White 'Q' rendered in Unbounded typography -->
  <text x="64" y="61" class="favicon-q">Q</text>
</svg>
